<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MUreplay</title>
    <link rel="stylesheet" href="css/tokens.css" />
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/stages/workspace.css" />
    <link rel="stylesheet" href="css/stages/edit.css" />
  </head>
  <body>
    <div id="app">
      <main class="page">
        <div class="workspace-header">
          <h1>MUreplay</h1>
          <div class="header-actions">
            <span class="headline">Load log file</span>
            <button
              class="browse-icon-btn"
              id="loadMenuBtn"
              type="button"
              aria-label="Load files"
            >
              <svg
                xmlns="http://www.w3.org/2000/svg"
                fill="none"
                viewBox="0 0 24 24"
                stroke-width="1.5"
                stroke="currentColor"
                aria-hidden="true"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  d="M19.5 14.25v-2.625a3.375 3.375 0 0 0-3.375-3.375h-1.5A1.125 1.125 0 0 1 13.5 7.125v-1.5a3.375 3.375 0 0 0-3.375-3.375H8.25m6.75 12-3-3m0 0-3 3m3-3v6m-1.5-15H5.625c-.621 0-1.125.504-1.125 1.125v17.25c0 .621.504 1.125 1.125 1.125h12.75c.621 0 1.125-.504 1.125-1.125V11.25a9 9 0 0 0-9-9Z"
                />
              </svg>
            </button>
            <span id="status" class="status-line" hidden
              >Load edited file and log</span
            >
          </div>
        </div>

        <section class="workspace">
          <div class="stage stage-edit" id="stageEdit">
            <div class="edit-top-row">
              <div class="chart-card">
                <div class="edit-controls-row">
                  <div class="edit-selects">
                    <select id="gridSelect" aria-label="Grid"></select>
                    <select id="muSelect" aria-label="Motor unit"></select>
                  </div>

                  <div
                    class="timeline-toolbar"
                    role="toolbar"
                    aria-label="Replay timeline controls"
                  >
                    <button
                      id="prevStepBtn"
                      class="pill-toggle"
                      type="button"
                      aria-label="Previous step"
                    >
                      ⏮
                    </button>
                    <input
                      id="timelineSlider"
                      type="range"
                      min="0"
                      max="0"
                      value="0"
                      step="1"
                    />
                    <button
                      id="nextStepBtn"
                      class="pill-toggle"
                      type="button"
                      aria-label="Next step"
                    >
                      ⏭
                    </button>
                    <button
                      id="playPauseBtn"
                      class="pill-toggle"
                      type="button"
                      aria-label="Play or pause"
                    >
                      ▶
                    </button>
                    <span id="timelineCounter">Step 0 / 0</span>
                  </div>
                </div>
                <span
                  id="replayStatus"
                  class="status-line"
                  aria-live="polite"
                ></span>
              </div>
            </div>

            <div class="chart-card edit-full" id="editDrCard">
              <div class="chart-title">Firing rate (pps)</div>
              <canvas id="dischargeRateCanvas" height="180"></canvas>
            </div>

            <div class="chart-card edit-full" id="editPulseCard">
              <div class="chart-title">Pulse train / discharge times</div>
              <canvas id="pulseTrainCanvas" height="220"></canvas>
              <canvas
                id="timelineCanvas"
                class="edit-timeline-canvas"
                aria-label="Navigation timeline"
              ></canvas>
            </div>
          </div>
        </section>
      </main>
    </div>

    <script type="module" src="app.js"></script>
  </body>
</html>

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mureplay"
version = "1.1.0"
description = "Interactive replay tool for MUedit2 motor unit editing sessions"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11.4"  # tarfile extraction filters
authors = [
  { name = "Simon Avrillon" },
]
keywords = ["EMG", "motor unit", "decomposition", "electromyography", "neuroscience", "replay"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
  "numpy>=2.4",
  "scipy>=1.17",
  "pydantic>=2.10",
  "fastapi>=0.141",
  "starlette>=1.3.1",  # imported directly; floor clears known advisories
  "uvicorn>=0.32",
  "pyedflib>=0.1.36",
]

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "twine>=5.1",
  "pytest>=8.3",
  "pytest-cov>=6.0",
  "httpx>=0.27",  # FastAPI TestClient backend (the tests/test_api_*.py)
  "ruff==0.15.16",  # keep in sync with the rev in .pre-commit-config.yaml
  "mypy==2.3.1",
  "pre-commit>=4.0",
]

[project.scripts]
mureplay = "mureplay.cli:main"

[tool.setuptools]
package-dir = {"" = "python/src"}

[tool.setuptools.packages.find]
where = ["python/src"]
include = ["mureplay*"]

[project.urls]
Repository = "https://github.com/simonavrillon/MUreplay"
"Bug Tracker" = "https://github.com/simonavrillon/MUreplay/issues"

[tool.pytest.ini_options]
# python/src runs the suite without an editable install; the repo root lets
# the tests import ``tests._api`` and ``tests.conftest``.
pythonpath = ["python/src", "."]
testpaths = ["tests"]
# -ra lists every skip, so a run without the sample data says so.
addopts = ["-ra", "--strict-markers"]
# conftest.py applies ``data`` to any test using a ``DATA_FIXTURES`` fixture.
markers = [
  "data: needs git-ignored sample recordings under data/ (auto-applied to declared fixtures)",
]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["frontend"]

[tool.ruff.lint]
select = [
  # Style and modernisation
  "I", "UP", "FA", "ANN", "C4", "SIM", "RET", "PERF", "RUF",
  # Bug finders
  "F", "B", "PLE", "PLW", "BLE", "S",
]
# ANN401: Any is deliberate at the JSON/array boundaries.
# C408: dict(key=value) calls read fine and are common in parameter overrides.
# RUF001-003: Greek letters and other non-ASCII symbols are intentional in
#   comments and docstrings.
# RUF046: int(round(x)) is kept as an explicit, numpy-safe idiom.
# S101: assert is used for internal invariants and throughout the tests.
# S603/S607: subprocess calls use fixed argument lists (file dialog helpers).
ignore = ["ANN401", "C408", "RUF001", "RUF002", "RUF003", "RUF046", "S101", "S603", "S607"]

[tool.ruff.lint.isort]
known-first-party = ["mureplay", "tests"]

[tool.mypy]
python_version = "3.12"  # numpy >=2.5 stubs use 3.12 syntax; ruff still targets py311
files = ["python/src/mureplay", "tests"]
mypy_path = "python/src"
explicit_package_bases = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_unreachable = true
enable_error_code = ["possibly-undefined", "redundant-expr", "truthy-bool"]

[[tool.mypy.overrides]]
# Third-party packages without type information.
module = ["scipy.*", "pyedflib.*"]
ignore_missing_imports = true

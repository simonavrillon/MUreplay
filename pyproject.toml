[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mureplay"
version = "1.0.0"
description = "Interactive replay tool for MUedit2 motor unit editing sessions"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11.4"
authors = [
  { name = "Simon Avrillon" },
]
keywords = ["EMG", "motor unit", "decomposition", "electromyography", "neuroscience", "replay"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
  "numpy>=2.4",
  "scipy>=1.17",
  "pydantic>=2.10",
  "fastapi>=0.141",
  "starlette>=1.3.1",
  "uvicorn>=0.32",
  "pyedflib>=0.1.36",
]

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "twine>=5.1",
  "pytest>=8.3",
  "pytest-cov>=6.0",
  "httpx>=0.27",
  "ruff==0.15.16",
  "mypy==2.3.1",
  "pre-commit>=4.0",
]

[project.scripts]
mureplay-api = "mureplay.cli:serve_api"

[tool.setuptools]
package-dir = {"" = "python/src"}

[tool.setuptools.packages.find]
where = ["python/src"]
include = ["mureplay*"]

[project.urls]
Repository = "https://github.com/simonavrillon/MUreplay"
"Bug Tracker" = "https://github.com/simonavrillon/MUreplay/issues"

[tool.pytest.ini_options]
pythonpath = ["python/src", "."]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers"]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["frontend"]

[tool.ruff.lint]
select = [
  "I", "UP", "FA", "ANN", "C4", "SIM", "RET", "PERF", "RUF",
  "F", "B", "PLE", "PLW", "BLE", "S",
]
ignore = ["ANN401", "C408", "RUF001", "RUF002", "RUF003", "RUF046", "S101", "S603", "S607"]

[tool.ruff.lint.isort]
known-first-party = ["mureplay", "tests"]

[tool.mypy]
python_version = "3.12"
files = ["python/src/mureplay", "tests"]
mypy_path = "python/src"
explicit_package_bases = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_unreachable = true
enable_error_code = ["possibly-undefined", "redundant-expr", "truthy-bool"]

[[tool.mypy.overrides]]
module = ["scipy.*", "pyedflib.*"]
ignore_missing_imports = true

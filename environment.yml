# DEPRECATED — MUreplay now uses uv (see README "Quick Start"): `uv sync`.
#
# This file is kept for one release so in-flight work is not disrupted.  It is
# no longer tested and its pins are no longer the source of truth --
# pyproject.toml declares the dependencies and uv.lock pins them.  The two were
# identical at the time of the switch; they will drift as uv.lock is updated.
#
name: MUreplay
channels:
  - conda-forge
  - defaults
dependencies:
  - python>=3.11
  - pip
  # Numerical / scientific core
  - numpy>=2.4
  - scipy>=1.17
  # API server
  - pydantic>=2.10
  - fastapi>=0.141
  - uvicorn>=0.32
  - python-multipart>=0.0.31
  # Native file dialogs (Linux; macOS uses AppleScript, Windows its own)
  - tk
  # EDF I/O
  - pip:
    - pyedflib>=0.1.36
